<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心願承諾卡 - 雲端同步版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { 
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background: #f0f2f5; 
        }
        .card-gradient { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .commitment-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        .commitment-card::before {
            content: "COMMITMENT";
            position: absolute;
            top: -20px;
            right: -20px;
            font-size: 5rem;
            font-weight: 900;
            color: rgba(0,0,0,0.03);
            transform: rotate(-15deg);
        }
        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- 導航欄 -->
    <nav class="bg-white shadow-sm mb-6 p-4 flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-xl font-bold text-indigo-600">? 承諾之約 (雲端同步)</h1>
        <div class="space-x-2">
            <button onclick="showView('user')" class="px-3 py-1 rounded bg-indigo-100 text-indigo-700 text-sm">參與端</button>
            <button onclick="showView('admin')" class="px-3 py-1 rounded bg-gray-100 text-gray-700 text-sm">管理與統計</button>
        </div>
    </nav>

    <div class="max-w-md mx-auto px-4">
        
        <!-- 視圖：使用者填寫介面 -->
        <div id="view-user" class="view-section">
            <div class="bg-white rounded-3xl p-8 shadow-xl border border-indigo-50">
                <h2 class="text-2xl font-bold text-center mb-2">許下你的承諾</h2>
                <p class="text-gray-400 text-sm text-center mb-6">您的承諾將自動記錄於雲端系統</p>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-gray-700 mb-1 font-bold">您的姓名</label>
                        <input type="text" id="user-name" placeholder="請輸入真實姓名" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-indigo-400 outline-none transition-all">
                    </div>

                    <div>
                        <label class="block text-gray-700 mb-1 font-bold">承諾對象</label>
                        <select id="target-select" class="w-full p-3 border rounded-xl bg-white"></select>
                    </div>

                    <div>
                        <label class="block text-gray-700 mb-1 font-bold">承諾項目</label>
                        <select id="item-select" onchange="toggleCustomInput()" class="w-full p-3 border rounded-xl bg-white"></select>
                    </div>

                    <div id="custom-item-container" class="hidden">
                        <label class="block text-gray-700 mb-1">請輸入您的自訂承諾</label>
                        <textarea id="custom-item-text" rows="2" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-indigo-400 outline-none" placeholder="我想承諾..."></textarea>
                    </div>

                    <button id="btn-submit" onclick="generateCard()" class="w-full card-gradient text-white font-bold py-4 rounded-xl shadow-lg flex justify-center items-center gap-2 hover:opacity-90 transition transform active:scale-95">
                        <span id="btn-text">產生承諾卡並同步</span>
                        <div id="btn-loader" class="loading-spinner hidden"></div>
                    </button>
                </div>
            </div>
        </div>

        <!-- 視圖：承諾卡結果 -->
        <div id="view-result" class="view-section hidden">
            <div id="card-display" class="commitment-card p-8 mb-6 border-t-8 border-indigo-600">
                <div class="text-center mb-8">
                    <p class="text-indigo-500 font-bold tracking-widest uppercase">Official Commitment</p>
                    <div class="h-1 w-12 bg-indigo-500 mx-auto mt-2"></div>
                </div>
                
                <div class="space-y-6 text-gray-800">
                    <p class="text-lg">我是 <span id="res-name" class="font-bold border-b-2 border-gray-300 px-2 text-2xl text-indigo-700"></span>，</p>
                    <p class="text-lg">在此鄭重向 <span id="res-target" class="font-bold text-indigo-700"></span> 承諾：</p>
                    <div class="bg-indigo-50 p-6 rounded-2xl italic text-xl text-center border border-indigo-100">
                        「<span id="res-item"></span>」
                    </div>
                    <p class="text-right text-gray-500 text-sm mt-8" id="res-date"></p>
                </div>

                <div class="mt-12 flex justify-between items-end border-t pt-6">
                    <div class="text-xs text-gray-400">
                        <p>千禧備案編號: #<span id="res-id"></span></p>
                        <p>Status: Cloud Synchronized</p>
                    </div>
                    <div class="w-16 h-16 bg-gray-100 flex items-center justify-center rounded">
                        <div id="qrcode-small"></div>
                    </div>
                </div>
            </div>
            
            <button onclick="showView('user')" class="w-full bg-indigo-50 text-indigo-600 font-bold py-3 rounded-xl mb-4 border border-indigo-200">再簽一張新承諾</button>
            <p class="text-center text-gray-500 text-[10px]">您可以長按卡片或截圖保存此承諾證明</p>
        </div>

        <!-- 視圖：管理端與排行榜 -->
        <div id="view-admin" class="view-section hidden">
            <div class="bg-green-600 text-white rounded-2xl p-6 shadow-md mb-6">
                <h3 class="font-bold text-lg mb-2 flex items-center gap-2">? 雲端服務已啟動</h3>
                <p class="text-xs text-green-100">目前資料將同步至您的最新 Google Apps Script 網址。</p>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-md mb-6">
                <h3 class="font-bold text-lg mb-4 border-b pb-2">?? 基礎設定</h3>
                <div class="space-y-4">
                    <div>
                        <label class="text-sm text-gray-500 font-bold">被承諾對象 (逗號分隔)</label>
                        <input type="text" id="admin-targets" class="w-full p-2 border rounded text-sm mt-1" value="寶眷,千禧社,自己,其他">
                    </div>
                    <div>
                        <label class="text-sm text-gray-500 font-bold">預設承諾項目 (逗號分隔)</label>
                        <input type="text" id="admin-items" class="w-full p-2 border rounded text-sm mt-1" value="幫洗腳一次,這週的洗碗我包了,這週的洗衣服我包了,這週的拖地我包了,其他">
                    </div>
                    <button onclick="updateSettings()" class="bg-indigo-600 text-white px-4 py-2 rounded text-sm w-full font-bold shadow-md">更新名單設定</button>
                </div>
                <div class="mt-4 pt-4 border-t">
                    <button onclick="clearLocalData()" class="text-red-500 text-xs hover:underline">?? 清空本地暫存數據 (不影響雲端)</button>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-md">
                <h3 class="font-bold text-lg mb-4">?? 活動即時報表 (由少至多)</h3>
                
                <div class="mb-6">
                    <h4 class="text-sm font-bold text-gray-400 mb-2 uppercase tracking-tighter">熱門承諾項統計</h4>
                    <div id="stats-container" class="space-y-2"></div>
                </div>

                <div>
                    <h4 class="text-sm font-bold text-gray-400 mb-2 uppercase tracking-tighter">最新承諾名單</h4>
                    <ul id="user-list" class="divide-y text-sm"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 更新後的 Google Apps Script URL
        const CLOUD_URL = "https://script.google.com/macros/s/AKfycbwdZimVpz1hykKklNkl5AyvlWdVZrt_5_9v7kfdXRmkBfg5WyGqC3JtsfQQp7doE-qH/exec";

        let settings = {
            targets: ["父母", "老師", "自己", "地球", "另一半"],
            items: ["每天早睡早起", "不再亂花錢", "每週運動三次", "準時交作業"]
        };

        let submissions = JSON.parse(localStorage.getItem('commitment_data')) || [];

        window.onload = () => {
            const savedTargets = localStorage.getItem('custom_targets');
            const savedItems = localStorage.getItem('custom_items');
            if(savedTargets) settings.targets = savedTargets.split(',');
            if(savedItems) settings.items = savedItems.split(',');
            
            loadDropdowns();
            renderStats();
            
            document.getElementById('admin-targets').value = settings.targets.join(',');
            document.getElementById('admin-items').value = settings.items.join(',');
        };

        function showView(viewId) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.add('hidden'));
            document.getElementById(`view-${viewId}`).classList.remove('hidden');
            if(viewId === 'admin') renderStats();
        }

        function loadDropdowns() {
            const targetSelect = document.getElementById('target-select');
            const itemSelect = document.getElementById('item-select');
            targetSelect.innerHTML = settings.targets.map(t => `<option value="${t}">${t}</option>`).join('');
            itemSelect.innerHTML = settings.items.map(i => `<option value="${i}">${i}</option>`).join('') + 
                                  `<option value="其他">其他（自行輸入）</option>`;
        }

        function toggleCustomInput() {
            const itemSelect = document.getElementById('item-select');
            const container = document.getElementById('custom-item-container');
            container.classList.toggle('hidden', itemSelect.value !== '其他');
        }

        async function generateCard() {
            const nameInput = document.getElementById('user-name');
            const name = nameInput.value.trim();
            const target = document.getElementById('target-select').value;
            let item = document.getElementById('item-select').value;
            
            if (item === '其他') {
                item = document.getElementById('custom-item-text').value.trim();
            }

            if (!name || !item) {
                alert("請完整填寫姓名與承諾內容！");
                return;
            }

            const btn = document.getElementById('btn-submit');
            const loader = document.getElementById('btn-loader');
            const btnText = document.getElementById('btn-text');
            
            btn.disabled = true;
            loader.classList.remove('hidden');
            btnText.innerText = "上傳雲端存檔中...";

            const data = {
                id: Math.floor(Math.random() * 900000) + 100000,
                name: name,
                target: target,
                item: item,
                date: new Date().toLocaleString('zh-TW')
            };

            try {
                await fetch(CLOUD_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                console.log("資料已成功提交至雲端管道");
            } catch (e) {
                console.warn("雲端提交失敗，僅存於本地", e);
            }

            submissions.push(data);
            localStorage.setItem('commitment_data', JSON.stringify(submissions));

            document.getElementById('res-name').innerText = data.name;
            document.getElementById('res-target').innerText = data.target;
            document.getElementById('res-item').innerText = data.item;
            document.getElementById('res-id').innerText = data.id;
            document.getElementById('res-date').innerText = data.date;

            const qrEl = document.getElementById('qrcode-small');
            qrEl.innerHTML = "";
            new QRCode(qrEl, { text: window.location.href, width: 64, height: 64 });

            btn.disabled = false;
            loader.classList.add('hidden');
            btnText.innerText = "產生承諾卡並同步";
            showView('result');
            nameInput.value = "";
        }

        function updateSettings() {
            const targetsStr = document.getElementById('admin-targets').value;
            const itemsStr = document.getElementById('admin-items').value;
            
            settings.targets = targetsStr.split(',').map(s => s.trim());
            settings.items = itemsStr.split(',').map(s => s.trim());
            
            localStorage.setItem('custom_targets', targetsStr);
            localStorage.setItem('custom_items', itemsStr);
            
            loadDropdowns();
            alert("名單設定已更新！");
        }

        function clearLocalData() {
            if(confirm("確定要清空本地數據？（不影響已上傳至雲端的資料）")) {
                submissions = [];
                localStorage.removeItem('commitment_data');
                renderStats();
            }
        }

        function renderStats() {
            const statsContainer = document.getElementById('stats-container');
            const userList = document.getElementById('user-list');

            const counts = {};
            submissions.forEach(s => { counts[s.item] = (counts[s.item] || 0) + 1; });

            const sortedItems = Object.keys(counts).sort((a, b) => counts[a] - counts[b]);

            statsContainer.innerHTML = sortedItems.map(item => `
                <div class="flex items-center justify-between text-sm bg-gray-50 p-3 rounded-lg border border-gray-100">
                    <span class="truncate pr-2 font-medium text-gray-700">?? ${item}</span>
                    <span class="bg-indigo-600 text-white px-3 py-1 rounded-full text-xs font-bold">${counts[item]}</span>
                </div>
            `).join('') || '<p class="text-xs text-gray-400 p-4 text-center">目前尚無承諾數據</p>';

            userList.innerHTML = [...submissions].reverse().map(s => `
                <li class="py-4">
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-indigo-700 text-base">${s.name}</span>
                        <span class="text-[10px] text-gray-400 bg-gray-100 px-2 py-0.5 rounded">ID: ${s.id}</span>
                    </div>
                    <div class="text-xs text-gray-600 mt-2">
                        對 <span class="font-bold text-gray-800">${s.target}</span> 承諾：
                        <div class="mt-1 p-2 bg-indigo-50 rounded italic">「${s.item}」</div>
                    </div>
                </li>
            `).join('') || '<li class="py-4 text-center text-gray-400">目前清單為空</li>';
        }
    </script>
</body>
</html>
